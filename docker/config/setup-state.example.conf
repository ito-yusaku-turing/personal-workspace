# =====================================================================================
# セットアップ項目の「使わない」宣言
#   （→ $USER_HOME_DIR/<個人設定ディレクトリ>/setup-state.conf）
#
#   ここには「使わないと決めた」という宣言だけを書く。
#   「設定済みかどうか」は毎回ライブに探知されるので書かない（書いても意味がない）。
#   宣言した項目は催促されなくなり、エージェントも黙って迂回する。
#
#   書式:
#     <項目>  skip  [理由]
#
#   編集はこのファイルを直接でもよいし、次のコマンドでもよい。
#     docker/bin/setup/state.sh list
#     docker/bin/setup/state.sh skip databricks 使っていない
#     docker/bin/setup/state.sh unskip databricks
#
#   現在の実効状態は次で確認できる。
#     docker/bin/doctor.sh                一覧（人間向け）
#     docker/bin/doctor.sh --porcelain    TSV（エージェント向け）
#
#   ★ 使える項目名はプロジェクトの構成によって変わる（docker/config/project.conf の
#     DEVBOX_WITH_* で同梱していないツールの項目は最初から現れない）。
#     正確な一覧は `docker/bin/setup/state.sh list` で確認すること。
#
#   よくある項目と、宣言したときに使えなくなるもの:
#     git-identity   commit ができません
#     ssh-key        push / fetch ができません
#     gh-auth        PR の作成・一覧ができません
#     agent-prefs    エージェントは全操作を都度確認します
#     aws            AWS を使う機能が動きません
#     databricks     Databricks を使う機能が動きません
#     gcloud         Google Cloud を使う機能が動きません
#     codex          Codex CLI を使いません
#
#   依存関係（node-modules）やアプリの環境変数ファイルは環境が動くための
#   前提条件なので宣言できない。
# =====================================================================================

# 例（先頭の # を外して使う）
# databricks   skip   使っていない
# codex        skip   Claude Code だけ使う
