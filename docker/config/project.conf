# ====================================================================================
# プロジェクト共通設定
#
#   **このファイルは git 管理下に置く**。開発者ごとに変わらない、プロジェクトの
#   アイデンティティと構成をここに集約する。開発者ごとの設定は docker/.env（管理外）。
#
#   docker/bin/lib/common.sh がこのファイルを読み、compose とイメージのビルドへ渡す。
#   シェルで source するため、値は単純な KEY=VALUE で書くこと
#   （空白を含む値は "..." で囲む。コマンド置換は使わない）。
#
#   ここを変えたら docker/bin/setup/image.sh でイメージを再ビルドすること
#   （プロジェクト名・マウント先・同梱ツールはイメージに焼き込まれる）。
# ====================================================================================


# ------------------------------------------------------------------------------------
# アイデンティティ
# ------------------------------------------------------------------------------------
# compose のプロジェクト名 兼 イメージ名の接頭辞（→ personal-workspace-devbox:latest）
PROJECT_NAME=personal-workspace

# 人間向けの表示名（セットアップやツール類の見出しに出る）
PROJECT_LABEL="Personal Workspace"

# このリポジトリのコンテナ内のマウント先。**固定パス**。
#   jadd_studio3 の devbox から repos.conf 経由でマウントしたときも同じパスになる。
#   追加リポジトリ（docker/config/repos.conf）は /usr/app/<名前> に並ぶ。
CONTAINER_REPO_DIR=/usr/app/personal-workspace

# 個人設定（agent-preferences.md / setup-state.conf）の置き場。コンテナ HOME 配下。
#   コンテナ HOME は jadd_studio3 と共有するが、STUDIO 用（~/.jadd-studio/）とは分ける。
PERSONAL_CONFIG_DIR_NAME=.personal-workspace

# コンテナ HOME の既定値（setup.sh が docker/.env を作るときの初期値）。
#   jadd_studio3 の devbox と共有する。
DEFAULT_USER_HOME_DIR=~/.jadd-studio/home

# コンテナのタイムゾーン。Claude Code の自動更新の日付境界（04:00）にも使う。
TZ=Asia/Tokyo

# ------------------------------------------------------------------------------------
# コーディングエージェント
# ------------------------------------------------------------------------------------
# Claude Code の Remote Control セッション名の接頭辞（<接頭辞>-MMDD になる）
AGENT_SESSION_PREFIX=pw

# ------------------------------------------------------------------------------------
# devbox イメージに同梱するツール（1 で有効 / 変更したら setup/image.sh で再ビルド）
#   常に入るもの: Node.js / git / git-lfs / ssh / gh / ripgrep / jq / fd /
#                 build-essential / python3 など
#   jadd_studio3 の devbox と同じ構成にしている（どちらから入っても同じ道具が使える）。
# ------------------------------------------------------------------------------------
DEVBOX_WITH_PSQL=1
DEVBOX_WITH_AWS=1
DEVBOX_WITH_GCLOUD=1
DEVBOX_WITH_DATABRICKS=1
DEVBOX_WITH_UV=1
