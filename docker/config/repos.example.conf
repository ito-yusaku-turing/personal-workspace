# ====================================================================================
# devbox にマウントする「他リポジトリ」の一覧
#
#   このファイルを docker/config/repos.conf にコピーして、自分が持っているリポジトリの
#   行を書く（docker/bin/setup.sh がコピーを促す）。repos.conf は git 管理外。
#   編集したら docker/bin/setup.sh --refresh を実行して反映する。
#
# 書式（空白区切り / # 以降はコメント）:
#
#   <名前>  <ホスト側の絶対パス>
#
#   - **コンテナ側のマウント先は `<CONTAINER_REPO_DIR の親>/<名前>` に固定**。
#     この設定では指定できない。開発者ごとにパスが変わると、コーディングエージェントが
#     他リポジトリを参照できなくなるため。
#     例: CONTAINER_REPO_DIR=/usr/app/myapp なら、名前 some-lib → /usr/app/some-lib
#   - ここに書いたパスがホストに存在しない場合、setup.sh は警告してその行を無視する。
#     （持っている人だけがマウントされ、持っていない人でも setup は通る）
#   - 各行は docker/.env の REPO_<名前を大文字化・ハイフンをアンダースコアに> にも
#     書き出される。compose のサービス定義からビルド元として参照したいときに使う。
#
#   ★ よく使うものは AGENTS.md の「関連リポジトリ」にも書いておくこと。
#     エージェントが「どのパスに何があるか」を知っている状態が、この仕組みの利点。
# ====================================================================================

# 例（持っているリポジトリの行のコメントを外し、パスを書き換える）
# jadd_studio3       /home/you/projects/jadd-studio/jadd_studio3
# mono-e2e           /home/you/projects/mlops/mono-e2e
# cdk-apps           /home/you/projects/mlops/cdk-apps
