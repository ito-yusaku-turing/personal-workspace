# ====================================================================================
# 開発環境 — Compose エントリポイント
#
#   操作は docker/bin/ 配下のスクリプトから行う（直接 docker compose を叩く必要はない）。
#   プロジェクト共通の設定は docker/config/project.conf（git 管理下）、
#   ユーザー個別の設定は docker/.env（git 管理外 / docker/bin/setup.sh が生成）に置く。
#
#   サービス:
#     devbox  : profile=cli。`docker compose run` 専用（シェル / claude / codex）
#
#   このワークスペースは常駐サービスを持たない。各プロジェクトの開発サーバーは
#   それぞれのリポジトリ側の docker で起動する（例: jadd_studio3 の docker/bin/up.sh）。
#   compose のプロジェクト名は COMPOSE_PROJECT_NAME で渡る（project.conf の PROJECT_NAME）。
#
#   サービスを増やすときは services/ に1ファイル追加し、下の include に足す。
# ====================================================================================

include:
  - services/devbox.yml
